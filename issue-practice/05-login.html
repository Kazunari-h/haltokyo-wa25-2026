<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAL Cafe - ログイン</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    label { display: block; margin-top: 12px; }
    input { padding: 6px; width: 260px; }
    button { margin-top: 16px; padding: 8px 16px; }
    .error { color: red; }
  </style>
</head>
<body>
  <a href="01-index.html">← トップへ戻る</a>
  <h1>会員ログイン</h1>
  <form id="loginForm">
    <label>ユーザー名
      <input type="text" id="username" autocomplete="username">
    </label>
    <label>パスワード
      <input type="text" id="password" autocomplete="current-password">
    </label>
    <button type="submit">ログイン</button>
  </form>
  <p class="error" id="error"></p>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('username').value;
      var pass = document.getElementById('password').value;
      if (user === 'admin' && pass === 'password123') {
        alert('ログインしました');
      } else {
        document.getElementById('error').textContent = 'ユーザー名またはパスワードが違います（正解: admin / password123）';
      }
    });
  </script>
</body>
</html>
